name: macOS checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-14
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run synthetic tests
        run: ./scripts/test.sh
      - name: Package and verify local app
        run: ./scripts/build.sh
